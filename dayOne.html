<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        <h1 class="headerStyle">Header</h1>
        <div class="menu">
            <div>
                <i class="fa fa-bars"></i>
                <span class="menuText">Modern Dashboard</span>
            </div>
            <div class="profile">
                <i class="fa fa-solid fa-bell"></i>
                <div>
                    <i class="fa fa-solid fa-user"></i>
                    <span>Athira</span>
                    <i class="fa fa-solid fa-caret-down"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="sidebar">
            <span>SIDEBAR</span>
            <ul>
                <li><i class="fa fa-home" aria-hidden="true"></i> Home</li>
                <li><i class="fa fa-bar-chart" aria-hidden="true"></i></i> Analytics</li>
                <li><i class="fa fa-solid fa-envelope"></i> Messages</li>
                <li><i class="fa fa-solid fa-gear"></i> Settings</li>
            </ul>
        </div>
        <div class="content">
            <span class="main-content">MAIN CONTENT</span>
            <h2>Welcome to the Dashboard</h2>
            <p>This is a simple dashboard layout created using HTML and CSS.</p>
        </div>

    </div>
</body>
</html>
